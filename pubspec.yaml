name: usaha_os
description: "Usaha OS — Malaysia Cafe POS & Operations Suite"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.1

  # Cloud backend
  supabase_flutter: ^2.8.4

  # Local offline DB (Drift + SQLite)
  drift: ^2.21.0
  drift_flutter: ^0.2.4

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  hugeicons: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Drift code generation
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
